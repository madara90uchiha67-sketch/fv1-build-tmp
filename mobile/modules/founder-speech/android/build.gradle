plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'expo.modules.founderspeech'
version = '0.1.0'

android {
  namespace "expo.modules.founderspeech"
  defaultConfig {
    versionCode 1
    versionName '0.1.0'
  }
}

dependencies {
  // Motor de voz neuronal sin conexión (sherpa-onnx). Lo deja en libs/ y jniLibs/ ci/fetch-neural-voice.sh antes de compilar.
  implementation files('libs/sherpa-classes.jar')
}
